# One-use return to this device's private temporary SSH launcher.
start on started framework
task

script
    token=/var/local/gleworks-coldboot-control.once
    [ -f "$token" ] && [ ! -L "$token" ] || exit 0
    [ "$(cat "$token")" = gleworks-coldboot-control-v1 ] || exit 1
    rm "$token" || exit 1
    sync
    launcher=/mnt/us/documents/gleworks-alpine-session.sh
    remaining=180
    umask 077
    while [ "$remaining" -gt 0 ]; do
        if [ -f "$launcher" ] && [ ! -L "$launcher" ] &&
           [ "$(sha256sum "$launcher" | awk '{print $1}')" = @LAUNCHER_SHA256@ ]; then
            # Verify a root-owned copy on tmpfs and execute that copy; the USB
            # path can be swapped by another host at any time.
            staged=/run/gleworks-return-$$
            if cp "$launcher" "$staged" && chmod 700 "$staged" &&
               [ "$(sha256sum "$staged" | awk '{print $1}')" = @LAUNCHER_SHA256@ ]; then
                exec /bin/sh "$staged"
            fi
            rm -f "$staged"
        fi
        sleep 2
        remaining=$((remaining - 2))
    done
    exit 1
end script
